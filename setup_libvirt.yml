---
# Main playbook to set up libvirt on Fedora 42+
# Works with both local and remote hosts
- name: Setup libvirt on Fedora host
  hosts: libvirt_hosts
  become: "{{ 'true' if inventory_hostname != 'localhost' else 'false' }}"
  gather_facts: true
  tasks:
    - name: Verify Fedora version
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Fedora'
          - ansible_distribution_major_version | int >= 42
        fail_msg: "This playbook requires Fedora 42 or higher"
      tags:
        - verify

    - name: Display host information
      ansible.builtin.debug:
        msg: |
          Setting up libvirt on:
          - Hostname: {{ inventory_hostname }}
          - OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          - Connection: {{ ansible_connection }}
          - Become: {{ ansible_become }}
      tags:
        - debug

    - name: Include libvirt setup role
      ansible.builtin.include_role:
        name: libvirt-setup
      tags:
        - setup

    - name: Verify libvirt installation
      ansible.builtin.command:
        cmd: virsh list --all
      register: virsh_output
      tags:
        - verify

    - name: Display libvirt status
      ansible.builtin.debug:
        msg: "{{ virsh_output.stdout }}"
      tags:
        - verify
